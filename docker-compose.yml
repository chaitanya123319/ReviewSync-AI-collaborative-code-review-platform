
services:
  db:
    image: postgres:16
    container_name: reviewsync-db
    environment:
      POSTGRES_USER: reviewsync
      POSTGRES_PASSWORD: reviewsync_dev
      POSTGRES_DB: reviewsync
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U reviewsync']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: reviewsync-backend
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://reviewsync:reviewsync_dev@db:5432/reviewsync
      JWT_SECRET: reviewsync-dev-secret-change-in-production
      AI_SERVICE_URL: http://ai-service:8000
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  ai-service:
    build: ./ai-service
    container_name: reviewsync-ai-service
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql://reviewsync:reviewsync_dev@db:5432/reviewsync
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      MODEL_NAME: ${MODEL_NAME:-qwen/qwen3-coder-30b-a3b-instruct}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./ai-service:/app

  frontend:
    build: ./frontend
    container_name: reviewsync-frontend
    ports:
      - '5173:5173'
    environment:
      BACKEND_URL: http://backend:3001
      VITE_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata:
